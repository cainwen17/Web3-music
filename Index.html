<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web3 Audio Launchpad</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background-color: #1e293b;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        .pi-redirect-banner {
            display: none;
            width: 100%;
            max-width: 480px;
            background-color: #f59e0b;
            color: #000;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            text-align: center;
            box-sizing: border-box;
        }
        .btn-open-pi {
            display: inline-block;
            background-color: #7c3aed;
            color: #fff;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 25px;
            font-weight: bold;
            margin-top: 10px;
            box-shadow: 0 4px 10px rgba(124, 58, 237, 0.4);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .btn-wallet {
            background-color: #eab308;
            color: #000;
            border: none;
            padding: 10px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        .user-status {
            font-size: 0.85rem;
            color: #10b981;
            margin-bottom: 12px;
            text-align: right;
        }
        .album-art {
            width: 100%;
            height: 260px;
            background-color: #334155;
            border-radius: 12px;
            object-fit: cover;
            margin-bottom: 16px;
        }
        .track-title { font-size: 1.25rem; font-weight: bold; margin: 0; }
        .artist-name { color: #94a3b8; margin-top: 4px; margin-bottom: 8px; }
        .badge-status {
            display: inline-block;
            font-size: 0.75rem;
            background-color: #334155;
            color: #cbd5e1;
            padding: 4px 10px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-weight: bold;
        }
        .badge-verified {
            background-color: #065f46;
            color: #34d399;
        }
        audio { width: 100%; margin-bottom: 20px; }
        .btn-collect {
            width: 100%;
            background-color: #8b5cf6;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-collect:disabled {
            background-color: #475569;
            color: #94a3b8;
            cursor: not-allowed;
        }
        .upload-section {
            border-top: 1px solid #334155;
            padding-top: 20px;
            margin-top: 20px;
        }
        .form-group { margin-bottom: 12px; text-align: left; }
        .form-group label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 4px; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            box-sizing: border-box;
        }
        .btn-upload {
            width: 100%;
            background-color: #3b82f6;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-verify {
            width: 100%;
            background-color: #10b981;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            display: none;
        }
        .copyright-box {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: #cbd5e1;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="pi-redirect-banner" id="piBanner">
    <strong>⚠️ You are in a standard browser</strong><br>
    <span style="font-size: 0.85rem;">Pi Wallet functions require Pi Browser.</span><br>
    <a href="#" id="piBrowserLink" class="btn-open-pi">🚀 Open Directly in Pi Browser</a>
</div>

<div class="container">
    <div class="header">
        <h3 style="margin:0;">Pi Audio NFT</h3>
        <button class="btn-wallet" id="walletBtn" onclick="connectPiWallet()">Connect Wallet</button>
    </div>
    
    <div class="user-status" id="userStatus"></div>

    <img id="albumArt" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500" alt="Cover" class="album-art">
    <h2 class="track-title" id="title">Genesis Beat #1</h2>
    <p class="artist-name" id="artist">Cainwen Studio [Music]</p>
    <div class="badge-status badge-verified" id="badgeStatus">🛡️ Verified NFT Asset</div>

    <audio id="audioPlayer" controls>
        <source id="audioSource" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <button class="btn-collect" id="collectBtn" onclick="payWithPi()">Collect Audio NFT (1 Test-Pi)</button>

    <div class="upload-section">
        <h4 style="margin-top:0;">Upload Audio (Creator Studio)</h4>
        
        <div class="form-group">
            <label>Audio Category</label>
            <select id="inputCategory">
                <option value="Music">Music / Song</option>
                <option value="Sound Effect">Sound Effect (SFX)</option>
                <option value="Nature Recording">Nature / Ambience</option>
                <option value="Voice & Podcast">Voice / Podcast / Spoken</option>
            </select>
        </div>

        <div class="form-group">
            <label>Audio Title</label>
            <input type="text" id="inputTitle" placeholder="Enter title">
        </div>

        <div class="form-group">
            <label>Creator / Artist Name</label>
            <input type="text" id="inputArtist" placeholder="Enter creator name">
        </div>

        <div class="form-group">
            <label>Select Audio File (MP3/WAV - Min 10s)</label>
            <input type="file" id="inputAudio" accept="audio/*">
        </div>

        <button class="btn-upload" onclick="uploadForStreaming()">🎵 Upload for Free Listening</button>

        <div id="nftVerificationArea" style="display:none; margin-top: 15px; border-top: 1px dashed #475569; padding-top: 15px;">
            <div class="copyright-box">
                <input type="checkbox" id="copyrightCheck">
                <label for="copyrightCheck">I legally declare that this audio (min. 10s) is 100% my original creation and free of copyright infringement.</label>
            </div>
            <button class="btn-verify" id="verifyBtn" onclick="verifyForNFTMinting()">🛡️ Verify Originality to Mint NFT</button>
        </div>
    </div>
</div>

<script>
    const myAppDomain = "cainwen17.github.io/Web3-music""; 
    const isPiBrowser = navigator.userAgent.includes("PiBrowser");
    
    let currentUploadedFile = null;
    let currentAudioDuration = 0;
    const registeredAudioHashes = new Set();

    window.onload = function() {
        const deepLink = "https://pi.browser/" + myAppDomain;
        document.getElementById('piBrowserLink').href = deepLink;

        if (!isPiBrowser) {
            document.getElementById('piBanner').style.display = "block";
        } else if (window.Pi) {
            window.Pi.init({ version: "2.0", sandbox: true });
        }
    };

    // 1. Upload Bebas untuk Mendengarkan + Hitung Durasi
    function uploadForStreaming() {
        const category = document.getElementById('inputCategory').value;
        const title = document.getElementById('inputTitle').value;
        const artist = document.getElementById('inputArtist').value;
        const audioFile = document.getElementById('inputAudio').files[0];

        if (!title || !artist || !audioFile) {
            alert("Please complete all fields and select an audio file!");
            return;
        }

        currentUploadedFile = audioFile;
        const audioURL = URL.createObjectURL(audioFile);

        const player = document.getElementById('audioPlayer');
        const source = document.getElementById('audioSource');
        source.src = audioURL;
        player.load();

        // Mengukur Durasi Audio
        player.onloadedmetadata = function() {
            currentAudioDuration = player.duration;
            console.log("Audio Duration:", currentAudioDuration, "seconds");

            // Update UI
            document.getElementById('title').innerText = title;
            document.getElementById('artist').innerText = artist + " [" + category + "]";
            
            const badge = document.getElementById('badgeStatus');
            badge.innerText = "🎧 Free Stream (" + Math.round(currentAudioDuration) + "s)";
            badge.className = "badge-status";

            const collectBtn = document.getElementById('collectBtn');
            collectBtn.disabled = true;
            collectBtn.innerText = "NFT Locked (Not Verified)";

            player.play();

            document.getElementById('nftVerificationArea').style.display = "block";
            document.getElementById('verifyBtn').style.display = "block";

            alert("Audio loaded! Duration: " + Math.round(currentAudioDuration) + "s. Complete verification below to enable NFT Minting.");
        };
    }

    // 2. Verifikasi Hak Cipta + Syarat Minimal 10 Detik
    async function verifyForNFTMinting() {
        const isChecked = document.getElementById('copyrightCheck').checked;

        if (!isChecked) {
            alert("You must agree to the copyright declaration!");
            return;
        }

        // PERIKSA SYARAT MINIMAL DURASI 10 DETIK
        if (currentAudioDuration < 10) {
            alert("❌ NFT Minting Rejected: Audio duration must be at least 10 seconds! (Current duration: " + Math.round(currentAudioDuration) + "s)");
            return;
        }

        alert("🔍 Scanning audio fingerprint (SHA-256) & checking duration eligibility...");

        try {
            const arrayBuffer = await currentUploadedFile.arrayBuffer();
            const hashBuffer = await crypto.subtle.digest('SHA-256', arrayBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const audioHash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

            // Cek Duplikasi
            if (registeredAudioHashes.has(audioHash)) {
                alert("❌ NFT Minting Rejected: Duplicate audio fingerprint detected!");
                return;
            }

            // Simpan Hash & Buka Akses NFT
            registeredAudioHashes.add(audioHash);

            const badge = document.getElementById('badgeStatus');
            badge.innerText = "🛡️ Verified Original NFT (" + Math.round(currentAudioDuration) + "s)";
            badge.className = "badge-status badge-verified";

            const collectBtn = document.getElementById('collectBtn');
            collectBtn.disabled = false;
            collectBtn.innerText = "Collect Audio NFT (1 Test-Pi)";

            alert("✅ Verification Passed! Audio meets duration requirement (>=10s) and fingerprint is unique.");

        } catch (error) {
            console.error(error);
            alert("Verification error.");
        }
    }

    async function connectPiWallet() {
        if (!isPiBrowser) {
            window.location.href = "https://pi.browser/" + myAppDomain;
            return;
        }

        try {
            const scopes = ['username', 'payments'];
            const auth = await window.Pi.authenticate(scopes, function(p){});
            document.getElementById('walletBtn').innerText = "Connected";
            document.getElementById('userStatus').innerText = "User: " + auth.user.username;
            alert("Successfully connected: " + auth.user.username);
        } catch (error) {
            alert("Pi Wallet authentication failed.");
        }
    }

    async function payWithPi() {
        if (!isPiBrowser) {
            window.location.href = "https://pi.browser/" + myAppDomain;
            return;
        }

        const paymentData = {
            amount: 1,
            memo: "Purchase Audio NFT",
            metadata: { songId: "track_001" }
        };

        const paymentCallbacks = {
            onReadyForServerApproval: function(pId) {},
            onReadyForServerCompletion: function(pId, txid) { alert("Transaction Successful! TXID: " + txid); },
            onCancel: function(pId) { alert("Canceled."); },
            onError: function(err) { alert("Error occurred."); }
        };

        try {
            await window.Pi.createPayment(paymentData, paymentCallbacks);
        } catch (error) {
            alert("Failed to process payment.");
        }
    }
</script>

</body>
</html>
